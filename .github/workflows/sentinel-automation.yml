name: Sentinel repository admission (read-only)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current default-branch commit SHA to inspect
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sentinel-admission-${{ github.repository }}-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SENTINEL_REPORT: ${{ runner.temp }}/sentinel/report.json
      SENTINEL_SCANNER_SHA256: 1fa00ab130df504dc55e026a353bf3cc253dfe167063c11e7362a67de9ca9d97
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Inventory the exact tracked tree without executing repository code
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/sentinel"
          base64 -d <<'SENTINEL_SCANNER' | gzip -dc > "$RUNNER_TEMP/sentinel/a.js"

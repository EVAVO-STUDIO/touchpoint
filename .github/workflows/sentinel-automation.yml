          chmod 0600 "$RUNNER_TEMP/sentinel/a.js"
          echo "$SENTINEL_SCANNER_SHA256  $RUNNER_TEMP/sentinel/a.js" | sha256sum -c -
          node --check "$RUNNER_TEMP/sentinel/a.js"
          node "$RUNNER_TEMP/sentinel/a.js"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-repository-admission-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/sentinel/report.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Enforce non-mutation and fail closed on unresolved activation
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -f "$SENTINEL_REPORT"
          node -e 'const r=require(process.env.SENTINEL_REPORT);console.log(`outcome=${r.outcome} entries=${r.trackedTree.entries} blockers=${r.blocking.total}`);if((r.blocking?.total??1)>0)process.exit(1)'
